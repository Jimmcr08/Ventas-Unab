<!DOCTYPE html>
<html>
<head>

    <title>Login UNAB</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body{

            height: 100vh;

            background-image: linear-gradient(
                rgba(0, 0, 0, 0.6),
                rgba(0,0,0,0.6)
            ),
            url("/static/fondo_unab1.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box{

            width: 400px;

            background: rgba(255,255,255,0.95);

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);

            text-align: center;
        }

        .logo{
            width: 120px;
            margin-bottom: 20px;
        }

        h2{
            margin-bottom: 25px;
            color: #003366;
        }

        input{

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border-radius: 10px;

            border: 1px solid #ccc;

            font-size: 15px;
        }

        button{

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #004aad;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover{
            background: #002f6c;
        }

        .texto{
            margin-top: 15px;
            color: gray;
            font-size: 14px;
        }
        .error{
            background: #ffd6d6;
            color: #b30000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    

    </style>

</head>
<body>

<div class="login-box">

    <img src="/static/unab.png" class="logo">

    <h2>UNAB Market</h2>
    {% if error %}

<p class="error">
    {{ error }}
</p>

{% endif %}

    <form method="POST">

        <input type="email"
               name="correo"
               placeholder="Correo institucional"
               required>

        <input type="password"
               name="password"
               placeholder="Contraseña"
               required>


        <button>Iniciar sesión</button>

    </form>

    <p class="texto">
        Acceso exclusivo para estudiantes UNAB
    </p>

</div>

</body>
</html>
